<script>
'use strict';
const state={variant:'niho',entry:'account',language:'ja',consent:false,scenario:'normal',paused:false,muted:false,showOriginal:true,ended:false,listener:'ja',joinLanguage:'en',joinStatus:'ready',left:false,mobileColumn:'entry'};
const people=[{name:'あなた',initial:'は',lang:'日本語',cls:'',code:'ja'},{name:'Emma',initial:'E',lang:'English',cls:'orange',code:'en'}];
const invitePeople=()=>people.map((p,i)=>({...p,lang:(i===0?state.language:state.joinLanguage)==='ja'?'日本語':'English',target:(i===0?state.language:state.joinLanguage)==='ja'?'English':'日本語'}));
const $=id=>document.getElementById(id);
const icon=(name,extra='')=>`<svg aria-hidden="true" ${extra}><use href="#i-${name}"/></svg>`;
const wave=()=>'<span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>';
const avatar=(person,large=false)=>`<span class="avatar ${person.cls||''} ${large?'large':''}">${person.initial}</span>`;
const button=(label,action,cls='primary',disabled=false)=>`<button type="button" class="btn ${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
function nav(title,back='back-entry',right=''){return `<header class="nav"><button class="iconbtn" type="button" aria-label="戻る" data-action="${back}">${icon('back')}</button><h1>${title}</h1>${right||'<span class="side"></span>'}</header>`;}
function route(place,path){$(place).innerHTML=`niho.life<strong>${path}</strong>`;}
function settingRow(label,ico,sub='',feature=false){return `<${feature?'button type="button" data-action="setup"':'div'} class="settings-row ${feature?'feature':''}"><span class="row-icon">${icon(ico)}</span><span class="grow">${label}${sub?`<span class="meta">${sub}</span>`:''}</span>${icon('next')}</${feature?'button':'div'}>`;}
function account(){return `${nav('<span class="pill-title">アカウント設定</span>','profile')}<div class="scroll"><div class="profile">${avatar({initial:'は'},true)}<div class="grow"><strong>田中 はる</strong><span class="handle">@haru_t</span></div><span class="row-icon">${icon('edit')}</span></div><section class="section"><h2 class="section-label">便利な機能</h2><div class="settings-group">${settingRow('対面通訳','translate','日本語と英語で、そのまま会話',true)}</div></section><section class="section"><h2 class="section-label">ログイン方法</h2><div class="settings-group"><div class="settings-row"><span class="row-icon">${icon('shield')}</span><span class="grow">Apple</span><span class="subvalue">連携済み</span></div></div></section><section class="section"><h2 class="section-label">通知</h2><div class="settings-group">${settingRow('通知設定','bell')}</div></section><section class="section"><h2 class="section-label">表示 / 言語</h2><div class="settings-group"><div class="settings-row"><span class="row-icon">${icon('globe')}</span><span class="grow">言語</span><span class="subvalue">日本語</span></div></div></section><section class="section"><h2 class="section-label">お支払い</h2><div class="settings-group">${settingRow('お支払い・領収書','card')}</div></section></div>`;}
function setup(){const standalone=state.variant==='standalone';return `<div class="${standalone?'screen-standalone':''}" style="display:contents">${nav(standalone?'NIHO Translate':'対面通訳','back-entry',`<button type="button" class="iconbtn" aria-label="通訳の設定" data-action="setup-info">${icon('more')}</button>`)}<div class="scroll"><div class="intro"><div class="symbol" aria-hidden="true"><span class="bubble">あ</span><span class="bubble second">En</span></div><p class="hero-copy">それぞれの言葉で、<br>同じ会話を。</p><p>目の前の人の声を、あなたの言葉に。</p></div><div class="language-settings"><div class="language-row"><label for="spoken-language">自分が話す言語</label><select id="spoken-language"><option value="ja" ${state.language==='ja'?'selected':''}>日本語</option><option value="en" ${state.language==='en'?'selected':''}>English</option></select></div><div class="language-row"><label>相手に届ける言語</label><output>${state.language==='ja'?'English':'日本語'}</output><span class="lang-code">${state.language==='ja'?'EN':'JA'}</span></div></div><div class="device">${icon('headphones')}<div class="grow"><strong>AirPods Pro</strong><small>マイク・音声出力ともに接続済み</small></div><button type="button" class="text-btn" data-action="audio-check">音声確認</button></div><div class="consent"><input type="checkbox" id="consent" ${state.consent?'checked':''}><label for="consent">音声を翻訳サービスへ送信することに同意します。録音・会話履歴はNIHOに保存しません。</label></div></div><div class="foot"><div class="button-stack">${button('会話ルームを作成','create','primary',!state.consent)}${button(icon('scan')+'QRで参加する','scan','secondary',!state.consent)}</div><p class="foot-note">2人それぞれのスマホとイヤフォンで。</p></div></div>`;}
function scan(){return `${nav('ルームに参加','setup')}<div class="scroll"><div class="room-top"><h2>QRを読み取る</h2><p>作成者の画面にQRを表示してください。</p></div><div class="scan-frame">${icon('scan')}</div><div class="join-details"><strong>田中 はるの会話ルーム</strong><small>日本語・English　／　1人が参加中</small></div><div class="language-settings" style="margin-top:16px"><div class="language-row"><label for="join-language">自分が話す言語</label><select id="join-language"><option value="en" ${state.joinLanguage==='en'?'selected':''}>English</option><option value="ja" ${state.joinLanguage==='ja'?'selected':''}>日本語</option></select></div><div class="language-row"><label>相手に届ける言語</label><output id="join-target">${state.joinLanguage==='en'?'日本語':'English'}</output></div></div></div><div class="foot">${button('参加をリクエスト','join-request','primary',state.joinLanguage===state.language)}<p class="foot-note">NIHOアカウントで参加します。相手とは異なる言語を選んでください。</p></div>`;}
function waiting(){return `${nav('ルームに参加','setup')}<div class="scroll"><div class="paused-panel" style="min-height:390px"><div class="big-icon">${icon('headphones')}</div><h2>参加の承認待ち</h2><p>田中 はるさんに、画面の番号を<br>確認してもらってください。</p><strong style="font-size:37px;letter-spacing:8px;font-weight:500;margin-top:26px">24</strong></div></div><div class="foot">${button('参加を取り消す','cancel-join','secondary')}</div>`;}
function admitted(){return `${nav('ルームに参加','setup')}<div class="scroll"><div class="paused-panel" style="min-height:390px"><div class="big-icon">${icon('check')}</div><h2>参加が承認されました</h2><p>自分の言語は${state.joinLanguage==='en'?'English':'日本語'}です。<br>イヤフォンとマイクを確認してください。</p></div></div><div class="foot">${button('準備ができた','participant-ready')}</div>`;}
function readyToJoin(){return `${nav('ルームに参加','setup')}<div class="scroll"><div class="paused-panel" style="min-height:390px"><div class="big-icon">${icon('check')}</div><h2>通訳の開始待ち</h2><p>田中 はるさんが始めると、<br>対面通訳へ進みます。</p></div></div><div class="foot">${button('参加を取り消す','cancel-join','secondary')}</div>`;}
function connected(){return `${nav('ルームに参加','setup')}<div class="scroll"><div class="paused-panel" style="min-height:390px"><div class="big-icon">${icon('headphones')}</div><h2>通訳に参加中</h2><p>あなたには${state.joinLanguage==='en'?'English':'日本語'}で届きます。</p></div></div><div class="foot">${button('通訳から退出','leave-dialog','secondary')}</div>`;}
function renderEntry(){let content=state.entry==='account'?account():state.entry==='scan'?scan():state.entry==='waiting'?waiting():state.entry==='admitted'?admitted():state.entry==='ready'?readyToJoin():state.entry==='connected'?connected():setup();$('entry-screen').innerHTML=content;$('entry-caption').textContent=state.entry==='account'?'アカウント設定':['scan','waiting','admitted','ready','connected'].includes(state.entry)?'ルームに参加':'通訳準備';route('url-entry',state.entry==='account'?'/account':['scan','waiting','admitted','ready','connected'].includes(state.entry)?'/translate/join':'/translate');}
function qr(){let cells='';for(let y=0;y<29;y++){for(let x=0;x<29;x++){const finder=(x<8&&y<8)||(x>=21&&y<8)||(x<8&&y>=21);if(finder)continue;if(((x*x+3*y*y+7*x*y+x*17+y*11)%13)<6)cells+=`<rect x="${x+2}" y="${y+2}" width="1" height="1"/>`;}}for(const [x,y]of[[2,2],[24,2],[2,24]])cells+=`<path d="M${x} ${y}h7v7h-7Z"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="white"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;return `<svg class="qr" viewBox="0 0 33 33" role="img" aria-label="会話ルームへの招待QRの表示例"><g fill="currentColor" stroke="none">${cells}</g></svg>`;}
function renderInvite(){
  const admitted=['admitted','ready'].includes(state.joinStatus);
  const count=1+Number(admitted);
  const participant=invitePeople()[1];
  const second=state.joinStatus==='empty'?`<div class="person"><div class="grow"><strong>参加者を待っています</strong><small>招待リンクまたはQRを共有してください</small></div></div>`:`<div class="person">${avatar(participant)}<div class="grow"><strong>${participant.name}</strong><small>${participant.lang} → ${participant.target}</small></div>${state.joinStatus==='pending'?`<button class="approve" type="button" data-action="approve">承認する</button>`:state.joinStatus==='admitted'?'<span class="ready">準備待ち</span>':'<span class="ready">'+icon('check')+'準備完了</span>'}</div>`;
  const canStart=state.joinStatus==='ready'&&state.joinLanguage!==state.language;
  $('invite-screen').innerHTML=`${nav('ルーム招待','setup')}<div class="scroll"><div class="room-top"><h2>会話への招待</h2><p>参加する人に読み取ってもらってください。</p></div><div class="qr-card">${qr()}<div class="room-code"><span>ルーム</span><strong>D7K4</strong></div><button type="button" class="share-button" data-action="share">${icon('share')}招待リンクを共有</button></div><div class="list-head"><h3>参加者</h3><span>${count} / 2人</span></div><div class="person">${avatar(invitePeople()[0])}<div class="grow"><strong>あなた <span style="font-size:9px;font-weight:400;color:var(--niho-text-sub)">作成者</span></strong><small>${invitePeople()[0].lang} → ${invitePeople()[0].target}</small></div><span class="ready">${icon('check')}準備完了</span></div>${second}</div><div class="foot">${button('通訳を始める','start','primary',!canStart)}<p class="foot-note">${state.joinLanguage===state.language?'異なる言語を選んでください。':canStart?'2人の準備ができました。':'相手の参加と準備を待っています。'}</p></div>`;
  route('url-invite','/translate/room/D7K4/invite');
}
function utterances(){const en=state.listener==='en';return `<article class="utterance past"><div class="utterance-head"><b>${en?'Haru':'Emma'}</b><span>${en?'日本語 → English':'English → 日本語'}</span><time>9:40</time></div><p class="translated">${en?'It’s lovely outside. Shall we go for a walk?':'今日は気持ちのいい天気ですね。少し散歩しませんか？'}</p></article><article class="utterance"><div class="utterance-head"><b>${en?'Haru':'Emma'}</b><span>${en?'日本語 → English':'English → 日本語'}</span><time>9:41</time></div><p class="translated">${en?'How about walking to the sea? There’s a quiet path nearby.':'鎌倉で、好きな場所はどこですか？'}</p>${state.showOriginal?`<p class="original">${en?'海まで歩いてみませんか？ 近くに静かな道があるんです。':'Where’s your favorite place around Kamakura?'}</p>`:''}${state.scenario==='normal'?`<div class="playing">${wave()}${en?'Playing in English':'日本語の音声を再生中'}</div>`:''}</article><article class="utterance mine"><div class="utterance-head"><b>${en?'You':'あなた'}</b><span>${en?'English → 日本語':'日本語 → English'}</span><time>9:41</time></div><p class="translated">${en?'That sounds wonderful. Let’s go!':'海まで歩いてみませんか？ 近くに静かな道があるんです。'}</p><div class="delivered">${icon('check')}${en?'Delivered in Japanese':'相手に英語で届けました'}</div></article>`;}
function renderLive(){const en=state.listener==='en',disconnected=state.scenario==='headphones',blocked=disconnected||state.paused||state.ended;const active=state.scenario==='normal';let content=state.left?`<div class="paused-panel" style="min-height:420px"><div class="big-icon">${icon('check')}</div><h2>通訳から退出しました</h2><p>ルームの通訳は終了していません。</p></div>`:state.ended?`<div class="paused-panel" style="min-height:420px"><div class="big-icon">${icon('check')}</div><h2>通訳を終了しました</h2><p>NIHOには録音・会話履歴を保存していません。</p></div>`:state.paused?`<div class="paused-panel"><div class="big-icon">${icon('pause')}</div><h2>通訳を一時停止中</h2><p>全員のマイク送信と翻訳を止めています。</p></div>`:utterances();const notice=disconnected?`<div class="notice"><strong>イヤフォンが接続されていません</strong><p>マイクと音声の再生を止めています。</p><button type="button" data-action="reconnect">イヤフォンを再接続</button></div>`:state.scenario==='delayed'?`<div class="notice"><strong>翻訳音声が間に合いませんでした</strong><p>会話の内容は、字幕で確認できます。</p><button type="button" data-action="reconnect">接続を確認</button></div>`:'';$('live-screen').innerHTML=`${nav(en?'Conversation':'対面通訳','end-dialog',`<button type="button" class="iconbtn" aria-label="通訳のメニュー" data-action="live-menu">${icon('more')}</button>`)}${state.ended||state.left?'':`<div class="live-top"><div class="live-title"><span class="connection" style="${blocked?'color:var(--niho-text-sub)':''}"><span class="dot"></span>${blocked?'一時停止中':en?'2 people connected':'2人で通訳中'}</span><span class="elapsed">08:24</span></div><div class="participants">${people.map((p,i)=>`<button type="button" class="participant ${!blocked&&active&&i===(en?0:1)?'active':''}" data-listener="${i===0?'ja':'en'}" aria-label="${i===0?'日本語':'英語'}で聞く画面"><span class="avatar-wrap">${avatar(p)}</span><span>${i===0?(en?'Haru':'あなた'):p.name}</span></button>`).join('')}</div><div class="language-band">${icon('headphones')}<span>${en?'You hear':'あなたに聞こえる言語'}</span><strong>${en?'English':'日本語'}</strong></div></div>`}<div class="scroll conversation">${notice}${content}</div><div class="foot live-foot">${state.ended||state.left?button('対面通訳へ戻る','finish','primary'):`<div class="device-line"><span>${icon('headphones')}${disconnected?'未接続':'AirPods Pro'}</span><button type="button" class="mini-control" data-action="captions" aria-pressed="${state.showOriginal}">${icon('caption')} 原文${state.showOriginal?'あり':'なし'}</button></div><div class="control-row"><button type="button" class="mic-button ${state.muted?'muted':''}" aria-label="${state.muted?'マイク送信を再開':'マイク送信を止める'}" aria-pressed="${state.muted}" data-action="mute" ${blocked?'disabled':''}>${icon(state.muted?'mic-off':'mic')}</button><button type="button" class="pause-btn" data-action="pause" ${disconnected?'disabled':''}>${icon(state.paused?'play':'pause')}${state.paused?'通訳を再開':en?'Pause translation':'通訳を一時停止'}</button><button type="button" class="mic-button" aria-label="音量" data-action="volume">${icon('volume')}</button></div><p class="foot-note">${state.muted?'自分のマイク送信を止めています。NIHOには録音・会話履歴を保存しません。':en?'NIHO does not store audio or conversation history.':'NIHOには録音・会話履歴を保存しません。'}</p>`}</div>`;route('url-live',state.ended?'/translate/complete':'/translate/room/D7K4');}
function selectColumn(column){state.mobileColumn=column;document.querySelectorAll('.col').forEach(el=>el.classList.toggle('mobile-active',el.id==='column-'+column));document.querySelectorAll('[data-column]').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.column===column)));}
function render(){renderEntry();renderInvite();renderLive();document.querySelectorAll('[data-variant]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.variant===state.variant)));selectColumn(state.mobileColumn);}
let toastTimer;
function toast(phone,message){document.querySelectorAll('.toast').forEach(el=>el.remove());const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;$(phone).append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2300);}
let sheetInvoker=null;
function closeSheet(){document.querySelectorAll('.sheet-backdrop').forEach(el=>el.remove());if(sheetInvoker?.isConnected)sheetInvoker.focus();sheetInvoker=null;}
function sheet(phone,title,body){closeSheet();sheetInvoker=document.activeElement;const el=document.createElement('div');el.className='sheet-backdrop';el.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">${title}</h2><button type="button" class="iconbtn" aria-label="閉じる" data-action="close-sheet">${icon('close')}</button></div>${body}</section>`;$(phone).append(el);el.querySelector('button')?.focus();el.addEventListener('click',e=>{if(e.target===el)closeSheet();});}
document.addEventListener('click',e=>{
  const variant=e.target.closest('[data-variant]');if(variant){state.variant=variant.dataset.variant;state.entry=state.variant==='niho'?'account':'setup';render();return;}
  const column=e.target.closest('[data-column]');if(column){selectColumn(column.dataset.column);return;}
    const listener=e.target.closest('[data-listener]');if(listener){state.listener=listener.dataset.listener;renderLive();return;}
  const control=e.target.closest('[data-action]');if(!control)return;const action=control.dataset.action;
  if(action==='setup'){state.entry='setup';renderEntry();selectColumn('entry');}
  else if(action==='approve'&&state.joinStatus==='pending'){state.joinStatus='admitted';state.entry='admitted';renderEntry();renderInvite();toast('phone-entry','参加が承認されました');}
  else if(action==='participant-ready'&&state.joinStatus==='admitted'){state.joinStatus='ready';state.entry='ready';renderEntry();renderInvite();}
  else if(action==='cancel-join'){state.joinStatus='empty';state.entry='setup';renderEntry();renderInvite();}
  else if(action==='back-entry'||action==='reset-entry'){state.entry=state.variant==='niho'?'account':'setup';renderEntry();}
  else if(action==='profile'){toast('phone-entry','@haru_t');}
  else if(action==='audio-check'){toast('phone-entry','マイク・音声出力を確認しました');}
  else if(action==='setup-info'){sheet('phone-entry','対面通訳',`<p>自分の言語で話すと、相手のイヤフォンに翻訳音声が届きます。</p><p>音声は外部の翻訳サービスへ送信します。NIHOでは録音・会話履歴を保存しません。</p>${button('閉じる','close-sheet','secondary')}`);}
  else if(action==='create'){state.joinStatus='empty';state.ended=false;state.left=false;renderInvite();selectColumn('invite');toast('phone-invite','会話ルームを作成しました');}
  else if(action==='pending-demo'){state.joinStatus='pending';state.entry='waiting';renderEntry();renderInvite();}
  else if(action==='share'){sheet('phone-invite','ルームへの招待',`<p>田中 はるの会話ルーム</p><div class="button-stack">${button(icon('share')+'招待リンクをコピー','copy-link','secondary')}${button('閉じる','close-sheet','ghost')}</div>`);}
  else if(action==='copy-link'){closeSheet();if(navigator.clipboard){navigator.clipboard.writeText('https://example.invalid/translate/join#mock-room').then(()=>toast('phone-invite','招待リンクをコピーしました')).catch(()=>toast('phone-invite','リンクをコピーできませんでした'));}else{toast('phone-invite','リンクをコピーできませんでした');}}
  else if(action==='scan'){state.entry='scan';renderEntry();}
  else if(action==='join-request'){if(state.joinLanguage===state.language)return;state.entry='waiting';state.joinStatus='pending';renderEntry();renderInvite();}
  else if(action==='start'){if(state.joinStatus!=='ready'||state.joinLanguage===state.language)return;state.paused=false;state.ended=false;state.left=false;state.entry='connected';renderEntry();state.scenario='normal';$('scenario').value='normal';renderLive();selectColumn('live');toast('phone-live','通訳を始めました');}
  else if(action==='mute'){state.muted=!state.muted;renderLive();}
  else if(action==='pause'){state.paused=!state.paused;renderLive();}
  else if(action==='captions'){state.showOriginal=!state.showOriginal;renderLive();}
  else if(action==='reconnect'){state.scenario='normal';state.paused=false;$('scenario').value='normal';renderLive();toast('phone-live','接続を確認しました');}
  else if(action==='volume'){sheet('phone-live','通訳の音量',`<div class="device">${icon('headphones')}<strong>AirPods Pro</strong></div><label style="font-size:12px" for="volume">翻訳音声</label><input id="volume" type="range" min="0" max="100" value="72" aria-label="翻訳音声の音量" style="width:100%;accent-color:var(--niho-accent-ink);margin:20px 0">${button('完了','close-sheet','secondary')}`);}
  else if(action==='live-menu'){sheet('phone-live','通訳の設定',`<button type="button" class="settings-row" data-action="menu-original" aria-pressed="${state.showOriginal}"><span class="grow">原文も表示</span><span class="toggle ${state.showOriginal?'':'off'}"></span></button><button type="button" class="settings-row" data-action="invite-view">${icon('qr')}<span class="grow">ルームのQR</span>${icon('next')}</button>${state.listener==='en'?'<button type="button" class="settings-row" data-action="leave-dialog"><span class="grow">自分だけ退出する</span></button>':'<button type="button" class="settings-row" data-action="end-dialog" style="color:var(--niho-danger)"><span class="grow">全員の通訳を終了</span></button>'}`);}
  else if(action==='menu-original'){state.showOriginal=!state.showOriginal;renderLive();closeSheet();}
  else if(action==='invite-view'){closeSheet();selectColumn('invite');toast('phone-invite','会話ルーム D7K4');}
  else if(action==='leave-dialog'){sheet('phone-live','通訳から退出しますか？',`<p>自分だけ退出します。ルームの通訳は終了しません。</p><div class="button-stack">${button('退出する','leave','danger')}${button('会話に戻る','close-sheet','secondary')}</div>`);selectColumn('live');}
  else if(action==='leave'){closeSheet();state.left=true;state.joinStatus='empty';state.entry='setup';renderEntry();renderInvite();renderLive();}
  else if(action==='end-dialog'){sheet('phone-live','全員の通訳を終了しますか？',`<p>参加している全員の音声送信と通訳を終了します。</p><div class="button-stack">${button('全員の通訳を終了','end','danger')}${button('会話に戻る','close-sheet','secondary')}</div>`);selectColumn('live');}
  else if(action==='end'){closeSheet();state.ended=true;renderLive();}
  else if(action==='finish'){state.ended=false;state.left=false;state.entry='setup';renderEntry();selectColumn('entry');}
  else if(action==='close-sheet'){closeSheet();}
});
document.addEventListener('change',e=>{if(e.target.id==='spoken-language'){state.language=e.target.value;renderEntry();renderInvite();}else if(e.target.id==='join-language'){state.joinLanguage=e.target.value;$('join-target').textContent=state.joinLanguage==='en'?'日本語':'English';renderInvite();renderEntry();}else if(e.target.id==='consent'){state.consent=e.target.checked;renderEntry();}else if(e.target.id==='scenario'){state.scenario=e.target.value;state.paused=false;state.ended=false;renderLive();selectColumn('live');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const panel=document.querySelector('.sheet');if(!panel)return;const focusable=[...panel.querySelectorAll('button:not(:disabled),input,select,a[href]')];if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script>
</body>
</html>
